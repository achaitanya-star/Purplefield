<!doctype html>
<html lang="en">
<head>

<title>iMigrate Config Studio - SAP AFS</title>
<style>
:root{--bg:#0d141b;--panel:#17222c;--panel2:#202e39;--line:#344652;--text:#edf4f7;--muted:#91a2ad;--cyan:#16c7e8;--blue:#1769aa;--green:#28c76f}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font:14px Segoe UI,Arial,sans-serif}button,input,select{font:inherit}header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#102a43;border-bottom:2px solid var(--cyan)}.brand{font-size:19px;font-weight:700}.brand b{color:var(--cyan)}.actions{display:flex;gap:8px}.btn{border:0;border-radius:5px;padding:8px 12px;background:var(--blue);color:#fff;cursor:pointer;font-weight:600}.btn:hover{background:#1486bd}.btn.green{background:var(--green);color:#06200f}.toolbar{height:58px;display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}label{color:var(--cyan);font-weight:700}input,select{background:#0b1117;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:8px}.search{width:360px}.count{margin-left:auto;color:var(--muted)}main{height:calc(100vh - 118px);display:grid;grid-template-columns:40% 60%;gap:12px;padding:12px}.panel{min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden;display:flex;flex-direction:column}.ph{height:44px;flex:0 0 44px;padding:12px 14px;border-bottom:1px solid var(--line);background:#1b2833;color:var(--cyan);font-weight:700;display:flex;justify-content:space-between}.scroll{overflow:auto;padding:10px;flex:1}.tree,.tree ul{list-style:none;margin:0;padding:0}.tree ul{margin-left:19px;padding-left:9px;border-left:1px dashed var(--line);display:none}.tree ul.open{display:block}.node{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:4px;cursor:pointer}.node:hover{background:#22323e}.node.selected{background:#123f50;border-left:3px solid var(--cyan)}.caret{width:14px;color:var(--cyan);font-weight:700}.level{font-size:10px;border:1px solid #3b6977;border-radius:10px;padding:2px 5px;color:var(--cyan)}.tables{margin-left:auto;font-size:10px;color:var(--green);border:1px solid #28774e;border-radius:10px;padding:2px 5px}.empty{text-align:center;color:var(--muted);padding:55px 20px}.crumb{color:var(--muted);font-size:12px;margin-bottom:12px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:10px}.card strong{display:block;color:var(--cyan);font-size:18px}.section{margin-top:12px;background:#111a22;border:1px solid var(--line);border-radius:6px;padding:12px}.section h3{margin:0 0 9px;color:var(--cyan);font-size:14px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--cyan);background:#0e171e;position:sticky;top:0}code{color:#b7f2ff}.notice{padding:9px;background:#332714;border:1px solid #9a6825;color:#f1c47f;border-radius:5px;margin-bottom:10px;font-size:12px}.tag{display:inline-block;margin:2px 4px 2px 0;padding:3px 6px;border-radius:10px;background:#263944;color:#bfeaf2;font-size:11px}.value{font-family:Consolas,monospace;color:#d8faff;line-height:1.7}.path{color:#c0ccd3;line-height:1.6}@media(max-width:900px){main{grid-template-columns:1fr}.search{width:220px}.count{display:none}}
</style>
</head>
<body>
<header><div class="brand">⚡ iMigrate Config Studio <b>· SAP AFS</b></div><div class="actions"><button class="btn" onclick="expandAll()">Expand All</button><button class="btn" onclick="collapseAll()">Collapse All</button><button class="btn green" onclick="selectVisible()">Select Visible Tables</button></div></header>
<div class="toolbar"><div><label>System</label><select><option>ECC 6.0 AFS</option><option>S/4HANA compatibility</option></select></div><div><label>Company Code</label><select><option>1000 - AFS Global</option><option>2000 - Europe</option><option>3000 - APAC</option></select></div><div><label>Search</label><input id="search" class="search" placeholder="ZNB, T161, grid, process..." oninput="filterTree()"></div><div id="count" class="count"></div></div>
<main><section class="panel"><div class="ph"><span>AFS E2E Process Configuration Tree</span><span>L1 → L6</span></div><div class="scroll"><ul id="tree" class="tree"></ul></div></section><section class="panel"><div class="ph"><span id="title">Select a configuration node</span><span id="nodeType"></span></div><div id="content" class="scroll"><div class="empty">Select a node from the left tree.<br><br>Configuration tables, fields, values, IMG path and T-code will appear here.</div></div></section></main>
<script>
const n=(id,name,level,children=[],tables=[],meta={})=>({id,name,level,children,tables,meta});
const AFS=[
 n('enterprise','01. Enterprise Structure',1,[n('org','Organization Structure',2,[n('cc','Company Code',3,[n('ccdef','Define Company Code',4,[],['T001'],{tc:'OX02',path:'SPRO → Enterprise Structure → Definition → Financial Accounting → Define Company Code',values:'BUKRS=1000 · WAERS=USD · KTOPL=INT'}),n('plant','Plant & Storage',4,[],['T001W','T001L','T001K'],{tc:'OX10 / OX09 / OX14',values:'PLANT=1000,1100,1200 · SLOC=0001,0002,0003'}),n('porg','Purchasing Organization',4,[],['T024E','T024W'],{tc:'OX08 / OX17',values:'EKORG=ZP01'})]),n('salesorg','Sales Organization',3,[n('salesdef','Sales Org / Channel / Division',4,[],['TVKO','TVTW','TVTA'],{path:'SPRO → Enterprise Structure → Definition → Sales and Distribution',values:'VKORG=ZS01 · VTWEG=10 · SPART=10'})])])]),

 n('procurement','03. Procurement',1,[n('pr','Purchase Requisition',2,[n('prdt','PR Document Types',3,[],['T161','T161T','EBAN','EBKN'],{tc:'OMEB'})]),n('po','Purchase Orders',2,[n('podt','Purchase Document Types',3,[n('potype','Document Type Control',4,[],['T161','T161T','T161P','T163','NRIV'],{tc:'OMEC',path:'SPRO → Materials Management → Purchasing → Purchase Order → Define Document Types',values:'BSART=ZNB · BSTYP=F · AFS Standard PO'}),n('znb','ZNB - Standard Purchase Order',5,[n('znbctrl','ZNB Document Type Control',6,[],['T161','T161T'],{values:'BSART=ZNB · BSTYP=F · Description=AFS Standard Purchase Order'}),n('znbnr','ZNB Number Range',6,[],['NRIV','TNRO'],{values:'OBJECT=EINKBELEG · NR=45 · Internal'}),n('znbitem','ZNB Allowed Item Categories',6,[],['T161P','T163'],{values:'PSTYP=0 Standard · 2 Consignment · 3 Subcontracting · 9 Service'}),n('znbacc','ZNB Account Assignment',6,[],['T163K','T163Y'],{values:'K=Cost Centre · F=Internal Order · A=Asset · P=WBS'}),n('znbrel','ZNB Release Strategy',6,[],['T16FG','T16FC','T16FS','T16FE','T16FV','T16FW'],{values:'S1 ≤10K · S2 10K-100K · S3 >100K USD'}),n('znbgrid','ZNB AFS Grid Procurement',6,[],['J_3APGHD','J_3APGEN','J_3ABSSI'],{values:'Grid=APPAREL01 · Color=BLACK/BLUE · Size=XS..XL'})]),n('zub','ZUB - Stock Transport Order',5,[],['T161','T001W','TVKWZ'],{values:'BSART=ZUB · Supplying=1000 · Receiving=1100'}),n('zsub','ZSUB - Subcontracting PO',5,[],['T161','T163'],{values:'BSART=ZSUB · PSTYP=3'})]),n('sourcing','Source Determination',3,[n('info','Purchasing Info Records',4,[],['EINA','EINE'],{tc:'ME11'}),n('source','Source Lists',4,[],['EORD'],{tc:'ME01'}),n('quota','Quota Arrangement',4,[],['EQUK','EQUP'],{tc:'MEQ1'})]),n('outline','Outline Agreements',3,[n('contract','Contracts',4,[],['A016','EKAB'],{tc:'ME31K'}),n('sched','Scheduling Agreements',4,[],['EKEK','EKEH'],{tc:'ME31L'})]),n('purchprice','Purchasing Pricing',3,[n('ct','Condition Technique',4,[n('cttab','Condition Tables',5,[],['T681','T681A'],{tc:'M/03'}),n('access','Access Sequences',5,[],['T682','T682I'],{tc:'M/07'}),n('ctype','Condition Types',5,[],['T685','T685A','T685T'],{tc:'M/06'}),n('schema','Calculation Schema',5,[],['T683','T683S','T683T'],{tc:'M/08'})]),n('records','Condition Records',4,[],['KONH','KONP'],{tc:'MEK1'})])])]),
 n('inventory','04. Inventory Management',1,[n('im','Inventory',2,[n('mov','Movement Types',3,[],['T156','T156T','T156W','T156S'],{tc:'OMJJ',values:'101=GR · 102=Reversal · 122=Return · 201=GI · 261=GI'}),n('gr','Goods Receipt',3,[],['T156','MKPF','MATDOC'],{values:'101 · AFS grid quantity by size/color'}),n('gi','Goods Issue',3,[],['T156','MATDOC'],{values:'201 · 261'}),n('stoim','Stock Transport',3,[],['T161','T001W','TVKWZ','T156'],{values:'ZUB → PGI → GR'}),n('stock','AFS Grid Stock',3,[],['J_3ABSSI','MARD'],{values:'Grid / Color / Size stock'})])]),
 n('sales','05. Sales & Distribution',1,[n('master','SD Master Data',2,[n('customer','Customer / BP',3,[],['BUT000','KNVV'],{tc:'BP / XD01'}),n('custmat','Customer Material Info',3,[],['KNMT'],{tc:'VD51'})]),n('orders','Sales Orders',2,[n('sdt','Sales Document Types',3,[n('zorder','ZOR - Standard Sales Order',4,[],['TVAK','TVAKT'],{tc:'VOV8',values:'AUART=ZOR · Standard AFS Sales Order'}),n('items','Item Categories',4,[],['TVAP','TVAPT'],{tc:'VOV7'}),n('sched','Schedule Lines',4,[],['TVEP'],{tc:'VOV6'}),n('atp','ATP / Allocation',4,[],['T441A','T459A'],{values:'AFS grid availability and allocation'})])]),n('delivery','Delivery / PGI',2,[n('deltype','Delivery Types',3,[],['TVLK','TVLKT'],{tc:'OVLK'}),n('pg','Picking / PGI',3,[],['T156','LIKP','LIPS'],{values:'601=PGI'})]),n('billing','Billing',2,[n('billtype','Billing Types',3,[],['TVFK','TVFKT'],{tc:'VOFA'}),n('bill','Billing Documents',3,[],['VBRK','VBRP','BKPF','BSEG'])])]),
 n('demand','06. AFS Demand Management',1,[n('seasonDemand','Season Demand',2,[n('demand','Demand / Forecast',3,[],['J_3AMSEA'],{values:'Season SS26/FW26 · Collection · Theme'}),n('requirements','Requirements / Consumption',3,[],['PBIM','PBED'],{values:'Forecast → Requirements → Consumption'})])]),
 n('mrp','07. MRP / Planning',1,[n('planning','MRP Configuration',2,[n('mrptype','MRP Types',3,[],['T438M','T399D'],{tc:'OMDQ / OMDP',values:'PD=MRP · VB=Reorder Point · ND=No MRP'}),n('controller','MRP Controller / Lot Size',3,[],['T024D','T439A'],{values:'Controller Z01 · Lot size EX'})]),n('proc','Procurement / Strategy',2,[n('procurementtype','Procurement Type',3,[],['MARC','T460A'],{values:'E=In-house · F=External · X=Both'}),n('strategy','Strategy / Requirements',3,[],['T461','T459A'],{values:'Strategy group / requirement class for AFS planning'}),n('gridplan','Grid-level Planning',3,[],['J_3APGEN','J_3ABSSI'],{values:'Plan by Color / Size / Grid'})])]),
 n('production','08. Production',1,[n('masterprod','Production Master Data',2,[n('bom','BOM',3,[],['MAST','STKO','STPO'],{tc:'CS01'}),n('routing','Routing / Work Center',3,[],['PLKO','PLPO','CRHD'],{tc:'CA01 / CR01'}),n('version','Production Version',3,[],['MKAL'],{tc:'C223'})]),n('ordersprod','Production Orders',2,[n('prodorder','Order / Confirmation / GI / GR',3,[],['AFKO','AFPO','AFRU','MATDOC'],{tc:'CO01 / CO11N',values:'Order → GI 261 → Confirmation → GR 101'}),n('gridprod','AFS Grid Production',3,[],['J_3APGHD','J_3APGEN','J_3ABSSI'],{values:'Component and finished grid quantities by size/color'})])]),
 n('pricing','09. Pricing',1,[n('salespricing','Sales Pricing',2,[n('condtables','Condition Tables',3,[],['T681','T681A'],{tc:'V/03'}),n('accessseq','Access Sequences',3,[],['T682','T682I'],{tc:'V/07'}),n('condtype','Condition Types',3,[],['T685','T685A','T685T'],{tc:'V/06'}),n('procedure','Pricing Procedures',3,[],['T683','T683S','T683T'],{tc:'V/08'}),n('conditionrecords','Condition Records',3,[],['KONH','KONP'],{tc:'VK11'})])]),
 n('logistics','10. Logistics Execution',1,[n('deliverycfg','Delivery Configuration',2,[n('shipping','Shipping Point / Delivery',3,[],['TVST','TVSWZ','TVLK'],{values:'Shipping point → Delivery → Picking → PGI'}),n('packing','Packing / Handling Units',3,[],['VEKP','VEPO'],{tc:'HU02'}),n('shipment','Shipment',3,[],['VTTK','VTTP'],{tc:'VT01N'})])]),
 n('finance','11. Finance Integration',1,[n('fi','FI / MM Integration',2,[n('valuation','Valuation',3,[],['T001K','T025','T134','MBEW'],{values:'Valuation area · Valuation class · Material type'}),n('obyc','Automatic Account Determination',3,[],['T030','T030K'],{tc:'OBYC',values:'BSX · WRX · GBB · PRD'}),n('tax','Tax Configuration',3,[],['T007A'],{tc:'FTXP'})])]),
 n('integration','12. AFS Integration & Controls',1,[n('idoc','EDI / IDoc',2,[n('idoccfg','Partner / Message Types',3,[],['EDPAR','EDMSG','EDP13'],{values:'ORDERS · DELVRY · INVOIC'})]),n('transport','BC Set / TR Packaging',2,[n('bcset','BC Set Package',3,[],['SCPRSETHEADER','SCPRSETDATA'],{tc:'SCPR3',values:'AFS process configuration grouped by dependency'}),n('transportcfg','Transport / Audit',3,[],['E070','E071','E071K'],{tc:'SE10 / SE01',values:'DEV → QAS → PRD'})])])
];
let selected=null;
const flat=[];function flatten(nodes,parent=[]){nodes.forEach(x=>{x.parent=parent;flat.push(x);flatten(x.children,parent.concat(x))})}flatten(AFS);
function nodeHTML(x){const has=x.children.length>0;return '<li data-id="'+x.id+'" data-search="'+escapeHtml((x.name+' '+x.tables.join(' ')+' '+(x.meta.path||'')+' '+(x.meta.values||'')).toLowerCase())+'"><div class="node" onclick="selectNode(\''+x.id+'\')"><span class="caret" onclick="event.stopPropagation();toggle(\''+x.id+'\')">'+(has?'▸':'•')+'</span><span class="level">L'+x.level+'</span><span>'+escapeHtml(x.name)+'</span>'+(x.tables.length?'<span class="tables">'+x.tables.length+' tbl</span>':'')+'</div>'+(has?'<ul id="ul-'+x.id+'">'+x.children.map(nodeHTML).join('')+'</ul>':'')+'</li>'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){document.getElementById('tree').innerHTML=AFS.map(nodeHTML).join('');document.getElementById('count').textContent=flat.filter(x=>x.tables.length).length+' configuration nodes / '+[...new Set(flat.flatMap(x=>x.tables))].length+' tables'}
function toggle(id){const u=document.getElementById('ul-'+id);if(u)u.classList.toggle('open');const li=document.querySelector('[data-id="'+id+'"]');const c=li&&li.querySelector(':scope > .node .caret');if(c)c.textContent=u&&u.classList.contains('open')?'▾':'▸'}
function selectNode(id){selected=flat.find(x=>x.id===id);document.querySelectorAll('.node.selected').forEach(e=>e.classList.remove('selected'));const li=document.querySelector('[data-id="'+id+'"]');if(li){li.querySelector(':scope > .node').classList.add('selected');let p=li.parentElement;while(p){if(p.tagName==='UL'){p.classList.add('open');const par=p.parentElement;const c=par&&par.querySelector(':scope > .node .caret');if(c)c.textContent='▾'}p=p.parentElement}}renderDetails(selected)}
function renderDetails(x){if(!x)return;document.getElementById('title').textContent=x.name;document.getElementById('nodeType').textContent='L'+x.level;const tables=x.tables;const m=x.meta||{};document.getElementById('content').innerHTML='<div class="crumb">AFS E2E → '+x.parent.map(p=>escapeHtml(p.name)).join(' → ')+' → '+escapeHtml(x.name)+'</div><div class="cards"><div class="card"><strong>'+x.level+'</strong>Level</div><div class="card"><strong>'+tables.length+'</strong>Tables</div><div class="card"><strong>'+x.children.length+'</strong>Sub-nodes</div></div>'+(m.path?'<div class="section"><h3>IMG Path</h3><div class="path">'+escapeHtml(m.path)+'</div></div>':'')+(m.tc?'<div class="section"><h3>T-Code</h3><code>'+escapeHtml(m.tc)+'</code></div>':'')+(m.values?'<div class="section"><h3>Example Values</h3><div class="value">'+escapeHtml(m.values)+'</div></div>':'')+(tables.length?'<div class="section"><h3>Configuration Table Catalog</h3><table><thead><tr><th>Table</th><th>Role</th></tr></thead><tbody>'+tables.map(t=>'<tr><td><code>'+escapeHtml(t)+'</code></td><td>'+role(t)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="notice">This node is a process/container node; select a child configuration node for table-level details.</div>')+'<div class="section"><h3>AFS Dependency</h3><div class="path">Grid / Color / Size / Season / Collection / Theme where applicable. Example Z* values are placeholders and must be validated in the target SAP release.</div></div>'}
function role(t){const r={T161:'Purchasing document types',T161T:'Purchasing document type texts',T163:'Purchasing item categories',T156:'Movement types',TVAK:'Sales document types',TVAP:'Sales item categories',TVEP:'Schedule lines',TVLK:'Delivery types',TVFK:'Billing types',T683:'Pricing procedures',T682:'Access sequences',T685:'Condition types',T681:'Condition tables',KONH:'Condition record headers',KONP:'Condition record items',J_3APGHD:'AFS grid header',J_3APGEN:'AFS grid values',J_3ABSSI:'AFS grid/stock data',J_3ASORT:'AFS sort sequence',T001:'Company code',T001W:'Plant',T001L:'Storage location',T024E:'Purchasing organization'};return r[t]||'SAP configuration / supporting object'}
function expandAll(){document.querySelectorAll('.tree ul').forEach(u=>u.classList.add('open'));document.querySelectorAll('.caret').forEach(c=>{if(c.textContent==='▸')c.textContent='▾'})}
function collapseAll(){document.querySelectorAll('.tree ul').forEach(u=>u.classList.remove('open'));document.querySelectorAll('.caret').forEach(c=>{if(c.textContent==='▾')c.textContent='▸'})}
function filterTree(){const q=document.getElementById('search').value.trim().toLowerCase();document.querySelectorAll('#tree li').forEach(li=>{li.style.display=!q||li.dataset.search.includes(q)?'':'none'});if(q)document.querySelectorAll('.tree ul').forEach(u=>u.classList.add('open'))}
function selectVisible(){document.querySelectorAll('#tree li').forEach(li=>{if(li.style.display!=='none'){const id=li.dataset.id;const x=flat.find(n=>n.id===id);if(x&&x.tables.length)selectNode(id)}})}
render();
</script>
